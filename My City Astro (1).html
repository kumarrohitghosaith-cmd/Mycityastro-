<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My City Astro</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#fff0f7;--card:#fff;--ink:#141014;--mute:#6f6470;--line:#f1d4e3;--pk:#e91e8c;--pk2:#b0125f;--on:#fff;--star:#d9c3cf;--ok:#1f9d55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110d11;--soft:#1d1219;--card:#1a141a;--ink:#fbf4f8;--mute:#b5a6b0;--line:#3a2434;--star:#4a3544;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110d11;--soft:#1d1219;--card:#1a141a;--ink:#fbf4f8;--mute:#b5a6b0;--line:#3a2434;--star:#4a3544;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind",system-ui,sans-serif;font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 16px;display:flex;align-items:center;gap:10px}
.av{flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:700}
.hi{flex:1;font-size:18px;font-weight:600}
.cash{border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-weight:700}
.ib{width:40px;height:40px;border-radius:50%;background:var(--pk);color:#fff;font-size:18px}
main{max-width:560px;margin:0 auto;padding:0 16px 100px}
.tab{display:none}.tab.on{display:block}
.sq{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:11px 18px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 14px}
.qk{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px}
.qk button{flex:none;width:74px;font-size:13px;line-height:1.2;text-align:center}
.qk span{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--pk);font-size:28px;margin:0 auto 6px}
.ban{display:flex;border-radius:20px;overflow:hidden;background:var(--pk);color:#fff;margin:6px 0 18px;min-height:130px}
.ban i{flex:1;background:#141014;display:grid;place-items:center;font-size:56px;font-style:normal;clip-path:polygon(0 0,100% 0,78% 100%,0 100%)}
.ban div{flex:1.3;padding:14px;text-align:center}
.ban b{display:block;font-size:34px;line-height:1.1}
.ban button{margin-top:8px;background:#141014;color:#fff;border-radius:999px;padding:6px 18px;font-weight:700}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.sh h2{margin:0;font-size:22px}.sh button{color:var(--mute)}
.hs{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px}
.hc{flex:none;width:150px;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center;background:var(--card);position:relative;overflow:hidden}
.hc .av{width:92px;height:92px;font-size:36px;border:3px solid var(--pk);margin:6px auto 8px}
.rb{position:absolute;top:0;left:0;background:#141014;color:#fff;font-size:11px;padding:2px 10px;border-radius:0 0 12px 0}
.hc b{display:block;font-size:19px}.hc p{margin:0 0 8px;color:var(--mute)}
.ob{border:2px solid var(--pk);color:var(--pk);border-radius:12px;padding:6px 0;width:100%;font-weight:700}
.ob.off{opacity:.5}
.store{background:var(--soft);border-radius:20px;padding:14px;margin-bottom:12px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.st button,.pb{background:var(--pk);color:#fff;border-radius:999px;padding:11px 8px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px}
.chip[aria-pressed="true"]{background:var(--pk);color:#fff;border-color:var(--pk)}
.lc{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;background:var(--card)}
.lc .av{width:64px;height:64px;font-size:26px;border:3px solid var(--pk)}
.lc .in{flex:1;min-width:0}.lc .in b{font-size:18px}.lc .m{color:var(--mute);font-size:14px}
.lc s{color:var(--mute)}.lc em{color:var(--pk);font-style:normal;font-weight:700}
.lc .ob{width:auto;padding:6px 14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;padding:7px 2px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center}
.nav span{font-size:22px}.nav [aria-current="page"]{color:var(--pk);font-weight:700}
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ov.on{display:flex}
.hd{background:#141014;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px}
.hd .t{flex:1;line-height:1.2}.hd .t span{display:block;font-size:13px;opacity:.85}
.end{background:var(--pk);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.m1{max-width:80%;padding:9px 13px;border-radius:16px;background:var(--soft);align-self:flex-start;overflow-wrap:anywhere}
.m1.me{background:var(--pk);color:#fff;align-self:flex-end}
.m1.sys{align-self:center;background:none;color:var(--mute);font-size:14px;text-align:center}
.qr{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0}
.inp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.inp input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--card);color:var(--ink);font:inherit}
.inp button{background:var(--pk);color:#fff;border-radius:999px;padding:0 18px;font-weight:700}
#cu{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#cu .av{width:130px;height:130px;font-size:52px;border:4px solid var(--pk)}
#cu h2{margin:0}#cu .row{display:flex;gap:14px;margin-top:14px}
#cu .row button{border:2px solid var(--pk);color:var(--pk);border-radius:999px;padding:10px 20px;font-weight:700}
.pgb{flex:1;overflow-y:auto;padding:16px;max-width:560px;width:100%;margin:0 auto}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.rg button{border:1px solid var(--line);border-radius:14px;padding:10px 2px;font-size:14px;display:flex;flex-direction:column;align-items:center;background:var(--card)}
.rg span{font-size:24px}
.box{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--card);margin-bottom:12px}
.box p{margin:6px 0}.box label{display:block;color:var(--mute);font-size:14px;margin-bottom:10px}
.box input,.box select{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);font:inherit}
.big{font-size:40px;font-weight:700;color:var(--pk);line-height:1}
.sheet{align-items:flex-end;background:rgba(10,4,8,.6)}
.panel{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 4px}.amts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.amts button{border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:18px;font-weight:700}
.amts button:hover{border-color:var(--pk)}
.hist{font-size:14px;color:var(--mute);max-height:90px;overflow-y:auto}
.close{width:100%;color:var(--mute);padding:8px}
.rs{display:flex;gap:4px;justify-content:center;margin:12px 0}.rs button{font-size:34px;color:var(--pk)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#141014;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90%;text-align:center}
[hidden]{display:none!important}
</style></head><body>
<header class="top">
 <div class="av" style="width:44px;height:44px;background:var(--pk)">R</div>
 <div class="hi">Hi Rohit</div>
 <button class="cash" id="wal" aria-label="Add cash"></button>
 <button class="ib" id="sup" aria-label="Customer support">🎧</button>
</header>
<main>
 <div class="tab on" id="t-home">
  <input class="sq" id="sq" type="search" placeholder="Search astrologers" aria-label="Search astrologers">
  <div class="qk" id="qk"></div>
  <div class="ban" id="bn"><i>🔮</i><div>Talk to astrologer for<b>FREE</b><button id="bc">Chat Now</button></div></div>
  <div class="sh"><h2>Astrologers</h2><button id="va">View All</button></div>
  <div class="hs" id="hl"></div>
  <div class="store"><div class="sh"><h2>My City Astro Store</h2><button id="vs"><u>Visit Store</u></button></div>
   <div class="st"><button id="sc">💬 Chat with Astrologer</button><button id="sl">📞 Call with Astrologer</button></div></div>
 </div>
 <div class="tab" id="t-chat"><div class="sh"><h2>Chat with Astrologers</h2></div><div class="chips" id="chips"></div><div id="al"></div></div>
 <div class="tab" id="t-call"><div class="sh"><h2>Call with Astrologers</h2></div><div id="cl"></div></div>
 <div class="tab" id="t-rem"><div class="sh"><h2>Remedies</h2></div><div class="rg" id="rm"></div><div class="sh"><h2>Gemstones</h2></div><div id="gl"></div></div>
</main>
<nav class="nav" id="nav"></nav>

<section class="ov" id="ss" aria-label="Session">
 <div class="hd"><div class="t"><b id="cn"></b><span id="cs"></span></div><button class="end" id="endb">End</button></div>
 <div id="cu"><div class="av" id="cav"></div><h2 id="cnm"></h2><div id="ctm"></div><div class="row"><button id="mu">Mute</button><button id="sp">Speaker</button></div></div>
 <div id="msgs" aria-live="polite"></div>
 <div class="qr" id="qr"></div>
 <form class="inp" id="f" onsubmit="return false"><input id="in" placeholder="Type your question" autocomplete="off" aria-label="Message"><button id="sb" type="button">Send</button></form>
</section>
<section class="ov" id="pg" aria-label="Page"><div class="hd"><button id="pb" aria-label="Back" style="font-size:22px">←</button><div class="t"><b id="pt"></b></div></div><div class="pgb" id="pc"></div></section>
<section class="ov sheet" id="rc" aria-label="Add cash"><div class="panel"><h2>Add cash</h2><div class="hist" id="rmsg">Choose an amount. Demo only, real payment comes later.</div><div class="amts" id="amts"></div><div class="hist" id="hist"></div><button class="close" id="cc">Close</button></div></section>
<section class="ov sheet" id="rv" aria-label="Rating"><div class="panel"><h2>How was the session?</h2><div class="rs" id="rst"></div><button class="close" id="rvc">Skip</button></div></section>
<div id="toast" role="status"></div>
<script>
const A=[
{id:1,n:'Acharya Rohit',t:'',s:['Vedic','Vastu'],l:'Hindi, English',e:5,p:27,d:22,r:5,o:'10k+',c:'#e91e8c',on:1},
{id:2,n:'Saptrishi',t:'Celebrity',s:['Vedic','Numerology'],l:'Hindi',e:12,p:80,d:67,r:5,o:'25k+',c:'#7b1fa2',on:1},
{id:3,n:'Trishani',t:'Rising Star',s:['Tarot','Numerology'],l:'Hindi, English',e:7,p:52,d:45,r:4,o:'8k+',c:'#c2185b',on:1},
{id:4,n:'Raadhika',t:'Celebrity',s:['Vedic','Tarot'],l:'Hindi, English',e:9,p:50,d:42,r:5,o:'12k+',c:'#ad1457',on:1},
{id:5,n:'Vastu Guru Suresh',t:'',s:['Vastu'],l:'Hindi',e:15,p:40,d:32,r:5,o:'18k+',c:'#424242',on:0}];
const GEM=[['Ruby (Manik)',2500,'💎'],['Pearl (Moti)',1800,'🦪'],['Yellow Sapphire',3200,'🟡'],['Emerald (Panna)',2800,'🟢'],['Blue Sapphire',4200,'🔷'],['Rudraksha 5 Mukhi',350,'📿']];
const R=[['Aries','♈'],['Taurus','♉'],['Gemini','♊'],['Cancer','♋'],['Leo','♌'],['Virgo','♍'],['Libra','♎'],['Scorpio','♏'],['Sagittarius','♐'],['Capricorn','♑'],['Aquarius','♒'],['Pisces','♓']];
const LD=['Mars','Venus','Mercury','Moon','Sun','Mercury','Venus','Mars','Jupiter','Saturn','Saturn','Jupiter'];
const HT=['New beginnings look promising today.','Think twice before money decisions.','Time with family will bring calm.','A stuck task may finally move.','Prioritise rest and avoid burnout.','Good news may come from someone close.'];
const LC=['Red','Yellow','Green','White','Blue','Pink'];
const REP=['Namaste! Please share your date, time and place of birth.','Your chart shows good signs for the coming months.','Try prayers on Thursday, wearing yellow.','Be patient, the planetary movement is about to shift.','I can explain this in more detail if you wish.'];
let bal=100,fol={},used=false,free=false,hist=[],q='',flt='All',cur=null,mode='chat',tm=null,sec=0,spent=0,ri=0;
try{const v=localStorage.getItem('mca_bal');if(v!==null&&!isNaN(+v))bal=+v}catch(e){}
const $=id=>document.getElementById(id);
function wal(){$('wal').textContent='Add Cash ₹'+bal+' +';try{localStorage.setItem('mca_bal',bal)}catch(e){}}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const ini=a=>a.n.replace(/^(Acharya|Vastu Guru)\s*/,'').charAt(0);
const TABS=[['home','🏠','Home'],['chat','💬','Chat'],['call','📞','Call'],['rem','🙏','Remedies']];
function tab(t){TABS.forEach(k=>{$('t-'+k[0]).classList.toggle('on',k[0]===t);$('n-'+k[0]).setAttribute('aria-current',k[0]===t?'page':'false')});closePg();scrollTo(0,0)}
TABS.forEach(k=>{const b=document.createElement('button');b.id='n-'+k[0];b.innerHTML='<span>'+k[1]+'</span>'+k[2];b.onclick=()=>tab(k[0]);$('nav').appendChild(b)});
function pick(m){return A.filter(a=>(flt==='All'||a.s.includes(flt))&&(!q||(a.n+a.s.join(' ')).toLowerCase().includes(q))).sort((x,y)=>y.r-x.r)}
function drawLists(){
  $('hl').innerHTML='';pick().forEach(a=>{const d=document.createElement('div');d.className='hc';d.innerHTML=(a.t?'<span class="rb">'+a.t+'</span>':'')+'<div class="av" style="background:'+a.c+'">'+ini(a)+'</div><b>'+a.n+'</b><p>₹'+a.d+'/min</p><button class="ob'+(a.on?'':' off')+'">Chat</button>';d.querySelector('button').onclick=()=>go(a,'chat');$('hl').appendChild(d)});
  [['al','chat','Chat'],['cl','call','Call']].forEach(([id,m,lb])=>{$(id).innerHTML='';pick().forEach(a=>{const d=document.createElement('div');d.className='lc';d.innerHTML='<div class="av" style="background:'+a.c+'">'+ini(a)+'</div><div class="in"><b>'+a.n+'</b> ✔<div class="m">'+a.s.join(', ')+' | '+a.l+'</div><div class="m">Exp: '+a.e+' yrs | '+'★'.repeat(a.r)+' | '+a.o+' orders</div><s>₹'+a.p+'</s> <em>₹'+a.d+'/min</em></div><button class="ob'+(a.on?'':' off')+'">'+(a.on?lb:'Offline')+'</button>';d.querySelector('button').onclick=()=>go(a,m);$(id).appendChild(d)})});
}
function chips(){$('chips').innerHTML='';['All','Vedic','Vastu','Tarot','Numerology'].forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=k;b.setAttribute('aria-pressed',k===flt);b.onclick=()=>{flt=k;chips();drawLists()};$('chips').appendChild(b)})}
function go(a,m){a.on?start(a,m):toast(a.n+' is offline right now.')}
function add(t,c){const m=document.createElement('div');m.className='m1 '+(c||'');m.textContent=t;$('msgs').appendChild(m);$('msgs').scrollTop=1e9}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function status(){const s=fmt(sec)+'  |  ₹'+cur.d+'/min  |  Spent ₹'+spent;$('cs').textContent=s;$('ctm').textContent=s}
function start(a,m){
  free=!used;if(!free&&bal<a.d){recharge('You need at least ₹'+a.d+' to start.');return}
  cur=a;mode=m;sec=0;ri=0;spent=free?0:a.d;if(!free){bal-=a.d;hist.unshift('-₹'+a.d+' '+a.n)}wal();used=true;
  $('msgs').innerHTML='';$('cn').textContent=a.n+(m==='call'?' (call)':'');
  const call=m==='call';$('cu').style.display=call?'flex':'none';$('msgs').hidden=call;$('qr').hidden=call;$('f').hidden=call;
  $('cav').textContent=ini(a);$('cav').style.background=a.c;$('cnm').textContent=a.n;status();
  add(free?'Your first 5 minutes are free. Then ₹'+a.d+'/min.':'Billing ₹'+a.d+' per minute.','sys');
  $('ss').classList.add('on');if(!call){$('in').focus();setTimeout(()=>add('Namaste, I am '+a.n+'. What would you like to ask?'),700)}
  clearInterval(tm);
  tm=setInterval(()=>{sec++;if(sec%60===0&&(!free||sec>=300)){if(bal>=cur.d){bal-=cur.d;spent+=cur.d;hist.unshift('-₹'+cur.d+' '+cur.n);wal()}else{stop(true);return}}status()},1000);
}
function stop(low){clearInterval(tm);cur=null;$('ss').classList.remove('on');toast('Session ended. Total ₹'+spent);if(low)setTimeout(()=>recharge('Balance finished. Add cash to continue.'),600);else setTimeout(()=>$('rv').classList.add('on'),500)}
function send(){const v=$('in').value.trim();if(!v||!cur)return;add(v,'me');$('in').value='';setTimeout(()=>{if(cur)add(REP[ri++%REP.length])},1100)}
function recharge(msg){$('rmsg').textContent=(msg?msg+' ':'')+'Choose an amount. Demo only, real payment comes later.';$('hist').innerHTML=hist.slice(0,5).map(h=>'<div>'+h+'</div>').join('')||'<div>No transactions yet</div>';$('rc').classList.add('on')}
function openPg(t,h){$('pt').textContent=t;$('pc').innerHTML=h;$('pg').classList.add('on');$('pc').scrollTop=0}
function closePg(){$('pg').classList.remove('on')}
function sign(dv){const p=dv.split('-'),v=+p[1]*100+(+p[2]);let r=8;[[114,9],[213,10],[314,11],[414,0],[515,1],[615,2],[716,3],[817,4],[917,5],[1018,6],[1117,7],[1216,8]].forEach(([s,i])=>{if(v>=s)r=i});return[r,p.join('').split('').reduce((x,y)=>x+ +y,0)%9+1]}
function horo(){openPg('Daily Horoscope','<div class="rg" id="rg2"></div><div class="box" id="hr">Choose your sign.</div>');R.forEach((r,i)=>{const b=document.createElement('button');b.innerHTML='<span>'+r[1]+'</span>'+r[0];b.onclick=()=>{const d=new Date().getDate();$('hr').innerHTML='<b>'+r[0]+' today</b><p>Career: '+HT[(i+d)%6]+'</p><p>Love: '+HT[(i+d+2)%6]+'</p><p>Health: '+HT[(i+d+4)%6]+'</p><p>Lucky colour: '+LC[(i+d)%6]+' | Lucky number: '+((i*3+d)%9+1)+'</p>'};$('rg2').appendChild(b)})}
function kundli(){openPg('Free Kundli','<div class="box"><label>Name<input id="kn"></label><label>Date of birth<input id="kd" type="date"></label><label>Time of birth<input id="kt" type="time"></label><label>Place of birth<input id="kp"></label><button class="pb" style="width:100%" id="kb">Generate Kundli</button></div><div class="box" id="kr" hidden></div>');
  $('kb').onclick=()=>{const dv=$('kd').value;if(!dv){toast('Choose date of birth.');return}const[r,n]=sign(dv);$('kr').hidden=false;$('kr').innerHTML='<b></b><p>Sun sign (approx.): '+R[r][1]+' '+R[r][0]+'</p><p>Ruling planet: '+LD[r]+'</p><p>Lucky number: '+n+' | Lucky colour: '+LC[r%6]+'</p><p style="color:var(--mute)">For full chart (lagna, dasha, doshas) talk to an astrologer.</p>';$('kr').querySelector('b').textContent=($('kn').value||'Your')+' Kundli'}}
function match(){openPg('Kundli Matching','<div class="box"><label>Boy name<input id="bn1"></label><label>Boy date of birth<input id="bd" type="date"></label><label>Girl name<input id="gn"></label><label>Girl date of birth<input id="gd" type="date"></label><button class="pb" style="width:100%" id="mb">Check match</button></div><div class="box" id="mr" hidden></div>');
  $('mb').onclick=()=>{if(!$('bd').value||!$('gd').value){toast('Enter both dates of birth.');return}const[a]=sign($('bd').value),[b]=sign($('gd').value);const g=17+((a*7+b*5+(+$('bd').value.slice(-2))+(+$('gd').value.slice(-2)))%19);$('mr').hidden=false;$('mr').innerHTML='<div class="big">'+g+'/36</div><p>'+(g>=28?'Excellent match':g>=18?'Good match, minor remedies advised':'Average match, consult an astrologer')+'</p><p style="color:var(--mute)">Demo score. A real Guna Milan needs birth time and place.</p>'}}
function gems(){$('gl').innerHTML='';GEM.forEach(g=>{const d=document.createElement('div');d.className='lc';d.innerHTML='<div class="av" style="background:var(--soft);font-size:30px">'+g[2]+'</div><div class="in"><b>'+g[0]+'</b><div><em>₹'+g[1]+'</em></div></div><button class="ob">Buy</button>';d.querySelector('button').onclick=()=>{if(bal<g[1]){recharge('Need ₹'+g[1]+' to buy '+g[0]+'.');return}bal-=g[1];hist.unshift('-₹'+g[1]+' '+g[0]);wal();toast(g[0]+' ordered.')};$('gl').appendChild(d)})}
const QK=[['🌅','Daily Horoscope',horo],['🔯','Free Kundli',kundli],['💎','Gemstones',()=>tab('rem')],['💍','Kundli Matching',match],['🆓','Free Chat',()=>go(A[0],'chat')]];
QK.forEach(k=>{const b=document.createElement('button');b.innerHTML='<span>'+k[0]+'</span>'+k[1];b.onclick=k[2];$('qk').appendChild(b)});
[['Daily Horoscope',horo],['Free Kundli',kundli],['Kundli Matching',match]].forEach(k=>{const b=document.createElement('button');b.innerHTML='<span>✨</span>'+k[0];b.onclick=k[1];$('rm').appendChild(b)});
$('wal').onclick=()=>recharge('');$('sup').onclick=()=>openPg('Customer Support','<div class="box"><b>We are here to help</b><p>Wallet, refund or astrologer issue? Write to support@mycityastro.example (demo).</p></div>');
$('bc').onclick=()=>go(A[0],'chat');$('va').onclick=()=>tab('chat');$('vs').onclick=()=>tab('rem');$('sc').onclick=()=>tab('chat');$('sl').onclick=()=>tab('call');
$('sq').oninput=e=>{q=e.target.value.trim().toLowerCase();drawLists()};
$('pb').onclick=closePg;$('endb').onclick=()=>stop(false);$('sb').onclick=send;$('in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});
$('mu').onclick=e=>{e.target.textContent=e.target.textContent==='Mute'?'Unmute':'Mute'};$('sp').onclick=e=>{e.target.textContent=e.target.textContent==='Speaker'?'Speaker on':'Speaker'};
['When will I get married?','How is my career?','Money','Health'].forEach(t=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=t;b.onclick=()=>{$('in').value=t;send()};$('qr').appendChild(b)});
[50,100,200,500].forEach(v=>{const b=document.createElement('button');b.textContent='₹ '+v;b.onclick=()=>{bal+=v;hist.unshift('+₹'+v+' added');wal();$('rc').classList.remove('on');toast('₹'+v+' added to wallet.')};$('amts').appendChild(b)});
$('cc').onclick=()=>$('rc').classList.remove('on');
for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent='★';b.setAttribute('aria-label',i+' stars');b.onclick=()=>{$('rv').classList.remove('on');toast('Thanks! '+i+' star rating saved.')};$('rst').appendChild(b)}
$('rvc').onclick=()=>$('rv').classList.remove('on');
wal();chips();drawLists();gems();tab('home');
</script></body></html>
